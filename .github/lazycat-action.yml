version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.gollum.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  toolchains: []
  run_buildscript: false

images:
  - id: gollum
    target: service
    service: gollum
    source: docker.io/gollumwiki/gollum
    channel: custom
    sort: created
    tag_regex: '^master$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: Gollum
      source: https://github.com/gollum/gollum
      source_author: gollum
  private:
    enabled: true
    skip_if_version_exists: true
    name: Gollum
    summary: Gollum LazyCat package published from GitHub Actions.
